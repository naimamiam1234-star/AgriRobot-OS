set timeout=3
set default=0
menuentry 'AgriRobot development Live (simulation only)' {
    linux /casper/vmlinuz boot=casper quiet console=tty0 console=ttyS0,115200n8 systemd.unit=multi-user.target ---
    initrd /casper/initrd
}
menuentry 'AgriRobot development Live - boot logs' {
    linux /casper/vmlinuz boot=casper console=tty0 console=ttyS0,115200n8 systemd.unit=multi-user.target ---
    initrd /casper/initrd
}
